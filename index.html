<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viviana Peralta - Four Points Tequendama</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            width: 100%;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .tarjeta {
            position: relative;
            width: 100%;
            max-width: 1086px;
        }

        .tarjeta img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* =========================
           BOTÓN WHATSAPP
           ========================= */

        .whatsapp {
            position: absolute;
            left: 3%;
            top: 82%;
            width: 13.5%;
            height: 10.5%;
            z-index: 10;
            cursor: pointer;
        }

        /* =========================
           BOTÓN CORREO
           ========================= */

        .correo {
            position: absolute;
            left: 15.5%;
            top: 82%;
            width: 14%;
            height: 10.5%;
            z-index: 10;
            cursor: pointer;
        }

        /* =========================
           BOTÓN UBICACIÓN
           ========================= */

        .ubicacion {
            position: absolute;
            left: 29.5%;
            top: 82%;
            width: 14%;
            height: 10.5%;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="tarjeta">

        <!-- TARJETA DIGITAL -->
        <img 
            src="Viviana Peralta (2).png" 
            alt="Tarjeta digital de Viviana Peralta"
        >

        <!-- WHATSAPP -->
        <a 
            class="whatsapp"
            href="https://wa.me/573175491613"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Contactar por WhatsApp"
        ></a>

        <!-- CORREO -->
        <a 
            class="correo"
            href="mailto:viviana.peralta@ghlhoteles.com"
            aria-label="Enviar correo electrónico"
        ></a>

        <!-- UBICACIÓN -->
        <a 
            class="ubicacion"
            href="https://www.google.com/maps/search/?api=1&query=Four+Points+by+Sheraton+Tequendama+Bogota"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver ubicación del hotel"
        ></a>

    </div>

</body>
</html>

</body>
</html>
