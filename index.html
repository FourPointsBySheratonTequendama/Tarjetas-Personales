<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjeta Digital</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .cargo {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            background: #222;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Juan Pérez</h1>

        <div class="cargo">
            Ejecutivo Comercial
        </div>

        <a class="button" href="tel:+573001234567">
            📞 Llamar
        </a>

        <a class="button"
           href="https://wa.me/573001234567"
           target="_blank">
            💬 WhatsApp
        </a>

        <a class="button"
           href="mailto:juan@hotel.com">
            ✉️ Correo
        </a>

        <a class="button"
           href="https://www.google.com"
           target="_blank">
            🌐 Página web
        </a>

    </div>

</body>
</html>
